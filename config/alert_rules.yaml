alerts:
  - name: HighLatencyP95
    severity: warning
    condition: latency_p95 > 3000ms
    duration: 5m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2.0%
    duration: 3m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: LowQualityOrRetrievalDegraded
    severity: warning
    condition: quality_score_avg < 0.75 or retrieval_success_rate < 90%
    duration: 5m
    type: symptom-based
    channel: "#alerts-llmops-l3a"
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-3
